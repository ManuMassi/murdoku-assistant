<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Murdoku Assistant</title>
<style>
  :root{
    --bg:#2a2639;
    --bg2:#332e47;
    --panel:#39344e;
    --panel2:#4a4467;
    --panel3:#565080;
    --line:#5b5480;
    --ink:#f3effb;
    --muted:#a9a1c6;
    --accent:#ffc857;
    --danger:#e05561;
    --ok:#5bc46a;
    --ink-dark:#1b1826;
    --plate:#15121f;
    --font-ui:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
    --font-display:"Arial Black","Segoe UI Black",Impact,"Segoe UI",system-ui,sans-serif;
    --font-name:Georgia,"Times New Roman",serif;
    --font-mono:ui-monospace,Consolas,"SF Mono",Menlo,monospace;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;height:100%;
    background:var(--bg);color:var(--ink);
    font-family:var(--font-ui);
    overscroll-behavior:none;
  }
  ::-webkit-scrollbar{width:10px;height:10px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:var(--panel2);border-radius:8px;border:2px solid var(--panel);}
  ::-webkit-scrollbar-thumb:hover{background:var(--panel3);}

  #app{
    display:grid;
    grid-template-columns:326px minmax(0,1fr) 240px;
    grid-template-rows:auto minmax(0,1fr);
    height:100vh;height:100dvh;
  }

  /* ---------- topbar ---------- */
  #topbar{
    grid-column:1/-1;
    display:flex;align-items:center;gap:18px;
    padding:9px 16px;background:linear-gradient(180deg,#3a3450,#302b43);
    border-bottom:2px solid var(--line);z-index:30;
    box-shadow:0 6px 18px rgba(0,0,0,.35);
  }
  .brand{display:flex;align-items:baseline;gap:9px;flex:0 0 auto;user-select:none;}
  .brand .word{font:900 23px/1 var(--font-display);letter-spacing:.5px;color:#fff;}
  .brand .word .eye{color:#ff5a5f;}
  .brand .tag{
    font:800 10px/1 var(--font-ui);letter-spacing:.22em;text-transform:uppercase;
    color:var(--muted);border:2px solid var(--line);border-radius:999px;padding:4px 8px;
  }
  .puzzle-meta{display:flex;align-items:center;gap:10px;flex:1 1 auto;min-width:0;}
  #puzzleTitle{
    flex:0 1 340px;min-width:120px;
    background:transparent;border:none;border-bottom:2px dashed var(--line);
    color:var(--ink);font:700 15px/1.2 var(--font-ui);padding:5px 6px;
  }
  #puzzleTitle::placeholder{color:var(--muted);font-weight:600;}
  #puzzleTitle:focus{outline:none;border-bottom-color:var(--accent);}
  #dimsBadge{
    flex:0 0 auto;background:var(--panel);border:2px solid var(--line);border-radius:999px;
    padding:4px 11px;font:800 11px/1 var(--font-ui);color:var(--muted);letter-spacing:.06em;white-space:nowrap;
  }
  #toolHint{
    flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    background:var(--plate);border:2px solid var(--line);border-left-width:6px;border-radius:10px;
    padding:4px 10px;font:800 11px/1.3 var(--font-ui);color:var(--ink);letter-spacing:.02em;
  }
  .topbar-right{display:flex;align-items:center;gap:8px;flex:0 0 auto;}
  #timerBox{
    display:flex;align-items:center;gap:6px;
    background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:4px 6px 4px 10px;
  }
  #timerDisplay{font:800 19px/1 var(--font-mono);min-width:74px;text-align:center;letter-spacing:.04em;}

  /* ---------- generic controls ---------- */
  button{font-family:inherit;cursor:pointer;color:var(--ink);}
  button:disabled{opacity:.32;cursor:not-allowed;}
  .btn{
    background:linear-gradient(180deg,#544d75,#433d5f);
    border:2px solid var(--line);border-radius:13px;
    font:700 12.5px/1.2 var(--font-ui);padding:9px 10px;
    box-shadow:0 3px 0 rgba(0,0,0,.32),inset 0 1px 0 rgba(255,255,255,.12);
    transition:filter .1s,transform .05s;
  }
  .btn:hover:not(:disabled){filter:brightness(1.16);}
  .btn:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.32),inset 0 1px 0 rgba(255,255,255,.12);}
  .btn:focus-visible{outline:3px solid var(--accent);outline-offset:2px;}
  .btn.wide{width:100%;}
  .btn.slim{padding:6px 8px;font-size:11px;}
  .btn.ghost{background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(0,0,0,.06));box-shadow:none;}
  .btn.danger{background:linear-gradient(180deg,#68314310,#5c2b3a),#5c2b3a;border-color:#8d3d51;}
  .btn.icon{padding:6px 9px;font-size:13px;border-radius:10px;}
  .btn.toggled{
    background:linear-gradient(180deg,#ffd77a,#f5b93f);border-color:#c9922f;color:var(--ink-dark);
    box-shadow:0 3px 0 rgba(0,0,0,.32),inset 0 1px 0 rgba(255,255,255,.5);
  }
  .btn .sub{display:block;font:600 9.5px/1.3 var(--font-ui);color:var(--muted);margin-top:4px;letter-spacing:.04em;text-transform:uppercase;}
  .btn.toggled .sub{color:rgba(27,24,38,.7);}
  input[type=number],input[type=text]{font-family:inherit;}
  input[type=number]{
    width:100%;background:var(--plate);color:var(--ink);border:2px solid var(--line);
    border-radius:9px;padding:6px 8px;font:800 14px/1 var(--font-ui);text-align:center;
  }
  input[type=number]:focus,input[type=text]:focus{outline:2px solid var(--accent);outline-offset:1px;}
  .suspect .name:focus{outline:2px solid var(--accent);outline-offset:0;}
  .mark-btn:focus-visible{outline:3px solid var(--accent);outline-offset:2px;}
  #fileInput,#importInput{display:none;}

  /* ---------- side panels ---------- */
  .panel{
    background:var(--panel);overflow-y:auto;overflow-x:hidden;
    padding:11px 10px 14px;display:flex;flex-direction:column;gap:10px;
  }
  #suspectsPanel{border-right:2px solid var(--line);}
  #toolsPanel{border-left:2px solid var(--line);}
  .panel-title{
    margin:0;text-align:center;font:800 16px/1 var(--font-ui);
    letter-spacing:.04em;color:#fff;position:relative;padding-bottom:9px;
  }
  .panel-title::after{
    content:"";position:absolute;left:50%;bottom:0;transform:translateX(-50%);
    width:38px;height:3px;border-radius:3px;background:var(--accent);opacity:.85;
  }
  .panel-hint{
    margin:-6px 0 0;text-align:center;font:600 10.5px/1.4 var(--font-ui);
    color:var(--muted);letter-spacing:.02em;
  }
  .section-label{
    margin:6px 0 -4px;font:800 9.5px/1 var(--font-ui);letter-spacing:.18em;
    text-transform:uppercase;color:var(--muted);text-align:center;
  }
  .divider{height:2px;background:var(--line);border:none;margin:2px 0;border-radius:2px;opacity:.6;}

  /* ---------- mode switch ---------- */
  #modeSwitch{display:flex;background:var(--plate);border:2px solid var(--line);border-radius:12px;padding:3px;gap:3px;}
  #modeSwitch button{
    flex:1;border:none;background:transparent;color:var(--muted);
    font:800 10.5px/1.2 var(--font-ui);padding:7px 3px;border-radius:9px;
    letter-spacing:.06em;text-transform:uppercase;
  }
  #modeSwitch button.toggled{background:var(--accent);color:var(--ink-dark);}

  /* ---------- suspect cards ---------- */
  #suspectList{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
  .suspect{
    position:relative;border:2px solid;border-radius:12px;padding:6px 5px 7px;
    display:flex;flex-direction:column;gap:5px;cursor:pointer;
    transition:transform .08s,filter .1s;
  }
  .suspect:hover{transform:translateY(-2px);filter:brightness(1.14);}
  .suspect:hover .token{box-shadow:inset 0 0 0 1px rgba(255,255,255,.45),0 0 14px rgba(0,0,0,.35);}
  .suspect .token{
    width:100%;aspect-ratio:1/.74;border-radius:9px;border:3px solid #14111d;
    display:flex;align-items:center;justify-content:center;
    font:900 24px/1 var(--font-display);color:var(--ink-dark);
    text-shadow:0 1px 0 rgba(255,255,255,.35);
    background-image:linear-gradient(180deg,rgba(255,255,255,.3),rgba(255,255,255,0) 45%,rgba(0,0,0,.16));
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.25);
  }
  .suspect .name{
    width:100%;min-width:0;background:var(--plate);border:2px solid #2a2440;border-radius:6px;
    color:#fff;font:italic 700 11px/1.25 var(--font-name);text-align:center;padding:3px 2px;
  }
  .suspect .name::placeholder{color:#6b6390;font-style:italic;}
  .suspect .check{
    position:absolute;top:-7px;right:-6px;width:20px;height:20px;border-radius:50%;
    background:var(--ok);color:#10240f;border:3px solid var(--panel);
    display:none;align-items:center;justify-content:center;font:900 10px/1 var(--font-ui);
  }
  .suspect.decided .check{display:flex;}
  .suspect.decided{filter:saturate(.5);}
  .suspect.decided .token{filter:saturate(.4) brightness(.66);}
  .suspect.active{box-shadow:0 0 0 3px var(--accent),0 0 16px rgba(255,200,87,.35);}
  .suspect.victim .ribbon{
    position:absolute;top:-9px;left:50%;transform:translateX(-50%);
    background:var(--danger);color:#fff;border:2px solid #14111d;border-radius:999px;
    font:900 7px/1 var(--font-ui);letter-spacing:.1em;padding:3px 6px;white-space:nowrap;
  }

  /* ---------- progress ---------- */
  #progressWrap{display:flex;flex-direction:column;gap:4px;margin-top:0;}
  #progressBar{height:9px;background:var(--plate);border:2px solid var(--line);border-radius:999px;overflow:hidden;}
  #progressFill{
    height:100%;width:0;transition:width .25s;
    background:linear-gradient(90deg,#4bb45c,#7fe08d);box-shadow:0 0 10px rgba(91,196,106,.6);
  }
  #lettersStatus{font:700 10.5px/1.4 var(--font-ui);color:var(--muted);text-align:center;}

  /* ---------- note symbols ---------- */
  #markRow{display:flex;gap:8px;justify-content:center;}
  .mark-btn{
    position:relative;width:100%;aspect-ratio:1/1;max-width:50px;
    background:var(--plate);border:3px solid #14111d;border-radius:12px;
    display:flex;align-items:center;justify-content:center;font-size:24px;line-height:1;
    box-shadow:0 3px 0 rgba(0,0,0,.32);
  }
  .mark-btn:hover{filter:brightness(1.3);}
  .mark-btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.32);}
  .mark-btn .key{position:absolute;bottom:1px;right:4px;font:800 9px/1 var(--font-ui);color:var(--muted);}
  .mark-btn.toggled{box-shadow:0 0 0 3px var(--accent),0 3px 0 rgba(0,0,0,.32);}

  /* ---------- tools ---------- */
  #btnX{
    width:100%;padding:14px 10px 10px;font:900 38px/1 var(--font-ui);
  }
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .field{display:flex;flex-direction:column;gap:4px;}
  .field span{font:800 9px/1 var(--font-ui);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);text-align:center;}

  /* ---------- stage ---------- */
  main#stage{
    position:relative;overflow:auto;
    display:flex;align-items:center;justify-content:center;
    padding:44px 24px 24px 52px;
    background:
      radial-gradient(ellipse at 50% 0%,rgba(255,200,87,.05),transparent 60%),
      repeating-linear-gradient(45deg,#2d2941,#2d2941 12px,#2a2639 12px,#2a2639 24px);
    box-shadow:inset 0 0 90px rgba(0,0,0,.4);
  }
  #imageContainer{
    position:relative;max-width:100%;
    touch-action:none;user-select:none;-webkit-user-select:none;
  }
  #imageContainer.no-image{
    width:min(720px,100%);aspect-ratio:1/1;max-height:100%;
    background:#221e30;border:2px dashed var(--line);border-radius:6px;
  }
  #imageContainer:not(.no-image){width:fit-content;}
  #bgImage{
    display:block;width:auto;height:auto;max-width:100%;border-radius:4px;
    user-select:none;-webkit-user-drag:none;pointer-events:none;
    box-shadow:0 8px 30px rgba(0,0,0,.5);
  }
  #bgImage[hidden]{display:none;}
  #placeholder{
    position:absolute;inset:0;display:flex;flex-direction:column;gap:8px;
    align-items:center;justify-content:center;
    color:var(--muted);font:600 13px/1.6 var(--font-ui);text-align:center;padding:26px;pointer-events:none;
    white-space:pre-line;
  }
  #placeholder .big{font-size:40px;}
  #stageHint{
    position:absolute;top:10px;left:50%;transform:translateX(-50%);
    background:var(--accent);color:var(--ink-dark);border:2px solid #c9922f;border-radius:999px;
    font:800 11px/1 var(--font-ui);padding:7px 14px;letter-spacing:.03em;
    box-shadow:0 3px 0 rgba(0,0,0,.3);z-index:12;display:none;
  }
  #app.unlocked #stageHint{display:block;}

  /* ---------- grid box ---------- */
  #gridBox{
    position:absolute;border:3px solid var(--accent);
    box-shadow:0 0 0 1px rgba(0,0,0,.65),0 0 18px rgba(255,200,87,.25);
  }
  #gridBox.locked{border-color:rgba(255,200,87,.5);box-shadow:0 0 0 1px rgba(0,0,0,.55);}
  #cellsGrid{position:absolute;inset:0;display:grid;width:100%;height:100%;}
  #colLabels{position:absolute;left:0;right:0;bottom:100%;height:24px;display:grid;pointer-events:none;}
  #rowLabels{position:absolute;top:0;bottom:0;right:100%;width:32px;display:grid;pointer-events:none;}
  .axis-label{
    display:flex;align-items:center;justify-content:center;
    font:800 11px/1 var(--font-ui);color:var(--ink);
    text-shadow:0 0 4px #000,0 0 3px #000,0 1px 2px #000;
    overflow:hidden;
  }
  .axis-label.on{color:var(--ink-dark);text-shadow:none;}
  .axis-label.on i{
    font-style:normal;background:var(--accent);border-radius:5px;padding:2px 5px;
  }
  .axis-label.done{color:#c9f2d1;}
  .axis-label.done i{
    font-style:normal;background:rgba(91,196,106,.32);border-radius:5px;padding:2px 5px;
    box-shadow:inset 0 0 0 1px rgba(91,196,106,.6);
  }
  .axis-label.on.done i{background:var(--accent);box-shadow:none;}

  /* ---------- cells ---------- */
  .cell{
    position:relative;border:1px solid rgba(255,255,255,.22);
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.2);
    display:flex;align-items:center;justify-content:center;overflow:hidden;
  }
  #gridBox.locked .cell{cursor:crosshair;}
  #gridBox.locked.tool-select .cell{cursor:pointer;}
  #gridBox:not(.locked) .cell{pointer-events:none;}
  .cell .ghost{
    position:absolute;display:flex;align-items:center;justify-content:center;
    pointer-events:none;z-index:4;opacity:.6;font-weight:900;line-height:1;
    font-family:var(--font-display);
  }
  .cell .ghost:empty{display:none;}
  .ghost-x{inset:0;color:#ff8f99;font-size:calc(var(--cell-size,40px) * .66);text-shadow:0 0 4px #000;}
  .ghost-mark{inset:0;font-size:calc(var(--cell-size,40px) * .6);text-shadow:0 0 4px #000;}
  .ghost-decision{
    left:10%;top:10%;width:80%;height:80%;border-radius:24%;
    border:2px dashed rgba(0,0,0,.7);color:var(--ink-dark);
    font-size:calc(var(--cell-size,40px) * .5);
  }
  .ghost-clue{
    right:5%;bottom:5%;
    width:calc(var(--cell-size,40px) * .3);height:calc(var(--cell-size,40px) * .3);
    border-radius:32%;border:1px dashed rgba(0,0,0,.7);
    color:var(--ink-dark);font-size:calc(var(--cell-size,40px) * .2);
  }
  .ghost-undo{background:#1c1828;color:#ffd77a;border-style:solid;border-color:rgba(255,215,122,.7);}
  .cell.cross{background:rgba(255,200,87,.11);}
  .cell.disabled{background:rgba(18,14,28,.44);}
  .cell.disabled::after{
    content:"✕";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    color:#ff6b78;font:900 calc(var(--cell-size,40px) * .68)/1 var(--font-ui);
    text-shadow:0 0 4px #000,0 0 2px #000;opacity:.85;
  }
  .cell.selected{outline:3px solid var(--accent);outline-offset:-3px;z-index:4;background:rgba(255,200,87,.2);}
  .cell.letter-highlight{background:rgba(255,159,10,.82);outline:2px solid #fff2c2;outline-offset:-2px;z-index:2;}
  .cell.empty-highlight{background:rgba(0,210,255,.42);box-shadow:inset 0 0 0 2px rgba(0,210,255,.95);z-index:2;}
  .cell .mark{
    position:absolute;font-size:calc(var(--cell-size,40px) * .6);line-height:1;
    opacity:.9;text-shadow:0 0 3px #000,0 1px 2px #000;pointer-events:none;
  }
  .cell .decision{
    display:none;width:80%;height:80%;border-radius:24%;
    border:2px solid rgba(0,0,0,.75);box-shadow:0 2px 0 rgba(0,0,0,.45);
    align-items:center;justify-content:center;z-index:3;
    font:900 calc(var(--cell-size,40px) * .5)/1 var(--font-display);
    color:var(--ink-dark);text-shadow:0 1px 0 rgba(255,255,255,.35);
  }
  .cell.has-decision .decision{display:flex;}
  .cell .candidates{
    position:absolute;inset:4%;display:flex;flex-wrap:wrap;
    align-content:center;justify-content:center;
    /* con inset 4% restano 92% di cella: i valori di chipScale() sono calibrati
       su questa larghezza, quindi cambiarli qui cambia anche come vanno a capo */
    gap:calc(var(--cell-size,40px) * .03);
    pointer-events:none;z-index:2;
  }
  .cell .candidates span{
    width:calc(var(--cell-size,40px) * var(--chip,.28));
    height:calc(var(--cell-size,40px) * var(--chip,.28));
    display:flex;align-items:center;justify-content:center;
    border-radius:32%;border:1px solid rgba(0,0,0,.55);
    font:900 calc(var(--cell-size,40px) * var(--chip,.28) * .72)/1 var(--font-display);
    color:var(--ink-dark);
    background-image:linear-gradient(180deg,rgba(255,255,255,.42),rgba(255,255,255,0) 55%,rgba(0,0,0,.12));
    box-shadow:0 1px 2px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.5);
  }
  .handle{
    position:absolute;width:22px;height:22px;background:var(--accent);border:3px solid #fff;
    border-radius:50%;touch-action:none;z-index:6;box-shadow:0 2px 6px rgba(0,0,0,.5);
  }
  .handle.nw{left:-11px;top:-11px;cursor:nwse-resize;}
  .handle.ne{right:-11px;top:-11px;cursor:nesw-resize;}
  .handle.sw{left:-11px;bottom:-11px;cursor:nesw-resize;}
  .handle.se{right:-11px;bottom:-11px;cursor:nwse-resize;}
  #gridBox.locked .handle{display:none;}
  #gridBox:not(.locked){cursor:move;}

  /* ---------- toast + help ---------- */
  #toast{
    position:fixed;bottom:34px;left:50%;transform:translateX(-50%);
    background:#12101c;color:#fff;padding:10px 18px;border-radius:12px;
    border:2px solid var(--line);font:700 13px/1.3 var(--font-ui);
    opacity:0;transition:opacity .25s;pointer-events:none;z-index:100;max-width:70vw;text-align:center;
  }
  #toast.show{opacity:1;}
  #helpOverlay{
    position:fixed;inset:0;background:rgba(12,10,20,.8);z-index:200;
    display:none;align-items:center;justify-content:center;padding:28px;
  }
  #helpOverlay.show{display:flex;}
  #helpCard{
    background:var(--panel);border:3px solid var(--line);border-radius:20px;
    width:min(660px,100%);max-height:82vh;overflow:auto;padding:22px 24px 24px;
    box-shadow:0 20px 60px rgba(0,0,0,.6);
  }
  #helpCard h2{margin:0 0 4px;font:800 21px/1.2 var(--font-ui);}
  #helpCard h3{margin:18px 0 8px;font:800 10.5px/1 var(--font-ui);letter-spacing:.18em;text-transform:uppercase;color:var(--muted);}
  #helpCard ul{margin:0;padding-left:20px;}
  #helpCard li{font:600 13px/1.65 var(--font-ui);color:var(--ink);margin-bottom:3px;}
  #helpCard .kbd-table{display:grid;grid-template-columns:auto 1fr;gap:7px 14px;align-items:center;}
  #helpCard kbd{
    display:inline-block;background:var(--plate);border:2px solid var(--line);border-bottom-width:3px;
    border-radius:7px;padding:4px 9px;font:800 12px/1 var(--font-mono);color:var(--ink);white-space:nowrap;
  }
  #helpCard .kbd-desc{font:600 13px/1.4 var(--font-ui);color:var(--ink);}
  #helpClose{margin-top:20px;}
</style>
</head>
<body>
<div id="app">

  <header id="topbar">
    <div class="brand">
      <span class="word">MURD<span class="eye">O</span>KU</span>
      <span class="tag" data-i18n="brandTag">assistant</span>
    </div>
    <div class="puzzle-meta">
      <input type="text" id="puzzleTitle" maxlength="60" data-i18n-placeholder="puzzleTitlePlaceholder">
      <span id="dimsBadge">10×10</span>
      <span id="toolHint"></span>
    </div>
    <div class="topbar-right">
      <div id="timerBox">
        <span id="timerDisplay">00:00</span>
        <button id="btnTimerToggle" class="btn icon"></button>
        <button id="btnTimerReset" class="btn icon" data-i18n-title="btnTimerReset">⟲</button>
      </div>
      <button id="btnLang" class="btn icon">EN</button>
      <button id="btnHelp" class="btn icon" data-i18n-title="helpTitle">?</button>
    </div>
  </header>

  <aside id="suspectsPanel" class="panel">
    <h2 class="panel-title" data-i18n="suspectsTitle">Suspects</h2>

  function loadLang(){

      const saved = localStorage.getItem(LANG_KEY);
      if(saved === 'it' || saved === 'en') return saved;
    }catch(e){}
    return 'en';
  }

  let lang = loadLang();

  function t(key, params){
    let s = (STRINGS[lang] && STRINGS[lang][key]) || key;
    if(params) for(const k in params) s = s.split('{'+k+'}').join(params[k]);
    return s;
  }

  function applyTranslations(){
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
    document.querySelectorAll('[data-i18n-title]').forEach(el => { el.title = t(el.dataset.i18nTitle); });
    document.querySelectorAll('[data-i18n-placeholder]').forEach(el => { el.placeholder = t(el.dataset.i18nPlaceholder); });
    btnLang.textContent = lang === 'it' ? 'EN' : 'IT';
    renderSuspects();
    renderMarkRow();
    renderTimerButtons();
    renderLockButton();
    renderHelp();
  }

  function setLang(newLang){
    lang = newLang;
    try{ localStorage.setItem(LANG_KEY, lang); }catch(e){}
    applyTranslations();

  // ---------- helpers ----------
  // il numero di decisioni piazzabili in totale (vincolo torre: una per riga E
  // per colonna) è min(righe, colonne) anche su griglie rettangolari.
  function objectCount(rr, cc){
    return Math.min(rr, cc);
  }

  function validLetters(count){
    const arr = [];
    for(let i=0;i<count-1;i++) arr.push(String.fromCharCode(97+i));
    arr.push('v');
    return arr;
  }

  function makeEmptyCells(rr, cc){
    const c = [];
    for(let r=0;r<rr;r++){
      const row = [];
      for(let col=0;col<cc;col++){
        row.push({x:false, decision:null, candidates:[], mark:null});
      }
      c.push(row);
    }
    return c;
  }

  // normalizza celle provenienti da sessionStorage o da un file importato:
  // riempie dimensioni mancanti e i campi introdotti dopo (es. `mark`).
  function normalizeCells(raw, rr, cc){
    const out = [];
    for(let r=0;r<rr;r++){
      const row = [];
      for(let c=0;c<cc;c++){
        const src = (raw && raw[r] && raw[r][c]) || {};
        row.push({
          x: !!src.x,
          decision: src.decision || null,
          candidates: Array.isArray(src.candidates) ? src.candidates.slice() : [],
          mark: src.mark || null
        });
      }
      out.push(row);
    }
    return out;
  }

  function isGloballyDecided(letter){
    for(const row of cells) for(const c of row) if(c.decision === letter) return true;
    return false;
  }

  // ---------- cronometro ----------
  function formatElapsed(ms){
    const totalSec = Math.floor(ms/1000);
    const h = Math.floor(totalSec/3600);
    const m = Math.floor((totalSec%3600)/60);
    const s = totalSec%60;
    const pad = v => String(v).padStart(2,'0');
    return h > 0 ? `${pad(h)}:${pad(m)}:${pad(s)}` : `${pad(m)}:${pad(s)}`;
  }

  function currentTimerElapsedMs(){
    return timerElapsedMs + (timerRunning && timerStartedAt ? Date.now() - timerStartedAt : 0);
  }

  function renderTimerDisplay(){
    timerDisplay.textContent = formatElapsed(currentTimerElapsedMs());
  }

  function renderTimerButtons(){
    btnTimerToggle.textContent = timerRunning ? t('btnTimerPause') : t('btnTimerStart');
    btnTimerToggle.classList.toggle('toggled', timerRunning);
  }

  function startTimerTick(){
    clearInterval(timerDisplayInterval);
    timerDisplayInterval = setInterval(renderTimerDisplay, 500);
    clearInterval(timerPersistInterval);
    timerPersistInterval = setInterval(persist, 30000);
  }

  function stopTimerTick(){
    clearInterval(timerDisplayInterval); timerDisplayInterval = null;
    clearInterval(timerPersistInterval); timerPersistInterval = null;
  }

  function toggleTimer(){
    if(timerRunning){
      timerElapsedMs = currentTimerElapsedMs();
      timerRunning = false;
      timerStartedAt = null;
      stopTimerTick();
    } else {
      timerRunning = true;
      timerStartedAt = Date.now();
      startTimerTick();
    }
    renderTimerDisplay();
    renderTimerButtons();
    persist();
  }

  // avvia (o riprende) il cronometro alla prima modifica della griglia; non-op se già in marcia
  function ensureTimerRunning(){
    if(timerRunning) return;
    timerRunning = true;
    timerStartedAt = Date.now();
    startTimerTick();
    renderTimerDisplay();
    renderTimerButtons();
  }

  function resetTimer(){
    timerElapsedMs = 0;
    timerStartedAt = timerRunning ? Date.now() : null;
    renderTimerDisplay();
    persist();
  }

  // ---------- pannello sospettati ----------
  // una card per lettera valida: token colorato (la "foto segnaletica"), nome
  // facoltativo scritto dall'utente e spunta quando la lettera è già stata decisa.
  function renderSuspects(){
    suspectList.innerHTML = '';
    validLetters(objectCount(rows, cols)).forEach(letter=>{
      const isVictim = letter === 'v';
      const color = letterColor(letter);

      const card = document.createElement('div');
      card.className = 'suspect' + (isVictim ? ' victim' : '');
      card.dataset.tool = letter;
      card.style.background = rgba(color, .15);
      card.style.borderColor = rgba(color, .55);

      if(isVictim){
        const ribbon = document.createElement('div');
        ribbon.className = 'ribbon';
        ribbon.textContent = t('victimTag');
        card.appendChild(ribbon);
      }

      const token = document.createElement('div');
      token.className = 'token';
      token.style.background = color;
      token.textContent = letter.toUpperCase();

      const name = document.createElement('input');
      name.className = 'name';
      name.type = 'text';
      name.maxLength = 18;
      name.value = suspectNames[letter] || '';
      name.placeholder = isVictim ? t('victimPlaceholder') : t('suspectPlaceholder', {letter: letter.toUpperCase()});
      name.addEventListener('input', ()=>{
        suspectNames[letter] = name.value;
        renderToolHint();
        persist();
      });
      name.addEventListener('keydown', e=>{
        e.stopPropagation();
        if(e.key === 'Enter' || e.key === 'Escape') name.blur();
      });

      const check = document.createElement('div');
      check.className = 'check';
      check.textContent = '✓';

      card.appendChild(token);
      card.appendChild(name);
      card.appendChild(check);
      card.addEventListener('click', ()=>selectTool(letter));
      card.addEventListener('pointerdown', ()=>highlightLetterOccurrences(letter));
      suspectList.appendChild(card);
    });
    highlightActiveTool();
    updateLetterButtonsState();
  }

  function renderMarkRow(){
    markRow.innerHTML = '';
    MARKS.forEach(m=>{
      const b = document.createElement('button');
      b.className = 'mark-btn';
      b.dataset.tool = '#' + m.id;
      b.title = t('markTitle', {glyph:m.glyph, key:m.key});
      b.innerHTML = '<span style="color:' + m.color + ';text-shadow:0 0 6px ' + rgba(m.color,.6) + '">' + m.glyph + '</span><span class="key">' + m.key + '</span>';
      b.addEventListener('click', ()=>selectTool('#' + m.id));
      markRow.appendChild(b);
    });
    highlightActiveTool();
  }

  function renderLockButton(){
    btnLock.textContent = locked ? t('btnLockLocked') : t('btnLockUnlocked');
    btnLock.title = locked ? t('btnLockTitleLocked') : t('btnLockTitleUnlocked');
    btnLock.classList.toggle('toggled', !locked);
    appEl.classList.toggle('unlocked', !locked);
  }

  function updateDimsBadge(){
    dimsBadge.textContent = rows + '×' + cols + ' · ' + objectCount(rows, cols) + '👤';
  }

  // ---------- lettere ancora da piazzare come decisione ----------
  function updateLetterButtonsState(){
    const letters = validLetters(objectCount(rows, cols));
    Array.from(suspectList.children).forEach(card=>{
      const letter = card.dataset.tool;
      const decided = isGloballyDecided(letter);
      card.classList.toggle('decided', decided);
      card.title = decided
        ? t('letterDecidedTitle', {letter: letter.toUpperCase()})
        : t('letterPendingTitle', {letter: letter.toUpperCase()});
    });
    const remaining = letters.filter(l => !isGloballyDecided(l));
    const placed = letters.length - remaining.length;
    progressFill.style.width = (letters.length ? (placed / letters.length * 100) : 0) + '%';
    lettersStatus.textContent = remaining.length === 0
      ? t('lettersAllPlaced', {total: letters.length})
      : t('lettersRemaining', {remaining: remaining.length, total: letters.length, list: remaining.map(l=>l.toUpperCase()).join(' ')});
  }

  let toastTimer = null;
  function showToast(msg){
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=>toast.classList.remove('show'), 1800);
  }

  // ---------- history ----------
  function snapshot(){
    return {
      rows, cols,
      gridBox: {...gridBox},
      cells: cells.map(row => row.map(c => ({x:c.x, decision:c.decision, candidates:[...c.candidates], mark:c.mark})))
    };
  }

  function applySnapshot(snap){
    rows = snap.rows;
    cols = snap.cols;
    gridBox = {...snap.gridBox};
    cells = snap.cells.map(row => row.map(c => ({x:c.x, decision:c.decision, candidates:[...c.candidates], mark:c.mark})));
    rowsInput.value = rows;
    colsInput.value = cols;
    updateDimsBadge();
    clampSelection();
    buildCellsDom();
    renderSuspects();
    renderGridBox();
    renderCells();
  }

  function pushHistory(){
    history = history.slice(0, historyIndex+1);
    history.push(snapshot());
    historyIndex = history.length - 1;
    updateUndoRedoButtons();
    persist();
  }

  function undo(){
    if(historyIndex <= 0) return;
    historyIndex--;
    applySnapshot(history[historyIndex]);
    updateUndoRedoButtons();
    ensureTimerRunning();
    persist();
  }

  function redo(){
    if(historyIndex >= history.length-1) return;
    historyIndex++;
    applySnapshot(history[historyIndex]);
    updateUndoRedoButtons();
    ensureTimerRunning();
    persist();
  }

  function updateUndoRedoButtons(){
    btnUndo.disabled = historyIndex <= 0;
    btnRedo.disabled = historyIndex >= history.length-1;
  }

  // ---------- persistence: un'unica sessione di lavoro ----------
  // Non c'è più selezione/switch tra sessioni multiple: un solo stato corrente
  // (rows, cols, gridBox, cells, img, titolo, nomi) autosalvato in background. Per
  // lavorare su un puzzle diverso si usa Esporta (salva su file) / Importa (carica
  // da file, sovrascrivendo la sessione corrente). L'undo/redo resta solo in memoria.
  //
  // Si usa sessionStorage, non localStorage: deve sopravvivere a un F5 sulla
  // stessa pagina (sessionStorage lo garantisce, è legato alla singola tab) ma
  // NON a una nuova apertura della pagina (nuova tab/finestra ha sessionStorage
  // vuoto anche per lo stesso file) — è esattamente il comportamento voluto,
  // senza bisogno di distinguere "reload" da "apertura nuova" a mano.
  const STORAGE_KEY = 'murdoku_state_v1';

  // chiavi del vecchio formato multi-sessione, mantenute solo per la migrazione
  // una tantum al primo avvio dopo l'aggiornamento; rimovibili in sicurezza
  // quando nessun utente dipenderà più da esse.
  const OLD_SESSIONS_INDEX_KEY = 'murdoku_sessions_index_v1';
  const OLD_SESSION_DATA_PREFIX = 'murdoku_session_v1_';
  const OLD_LAST_ACTIVE_KEY = 'murdoku_last_active_v1';

  function migrateFromMultiSession(){
    let idx;
    try{
      const raw = localStorage.getItem(OLD_SESSIONS_INDEX_KEY);
      idx = raw ? JSON.parse(raw) : null;
    }catch(e){ idx = null; }
    if(!idx || !idx.length) return null;

    let lastActive = null;
    try{ lastActive = localStorage.getItem(OLD_LAST_ACTIVE_KEY); }catch(e){}
    const target = idx.find(s=>s.id===lastActive) || idx[0];

    let data = null;
    try{
      const raw = localStorage.getItem(OLD_SESSION_DATA_PREFIX + target.id);
      data = raw ? JSON.parse(raw) : null;
    }catch(e){}

    idx.forEach(s=>{ try{ localStorage.removeItem(OLD_SESSION_DATA_PREFIX + s.id); }catch(e){} });
    try{ localStorage.removeItem(OLD_SESSIONS_INDEX_KEY); }catch(e){}
    try{ localStorage.removeItem(OLD_LAST_ACTIVE_KEY); }catch(e){}
    return data;
  }

  function loadStoredData(){
    try{
      const raw = sessionStorage.getItem(STORAGE_KEY);
      if(raw) return JSON.parse(raw);
    }catch(e){}
    return migrateFromMultiSession();
  }

  function persist(){
    try{
      sessionStorage.setItem(STORAGE_KEY, JSON.stringify({
        rows, cols, gridBox, cells, img,
        puzzleTitle, suspectNames,
        timerElapsedMs: currentTimerElapsedMs(),
        timerRunning
      }));
    }catch(e){
      showToast(t('toastStorageFull'));
    }
  }

  // i dati salvati/esportati dal vecchio formato quadrato hanno un campo `n`
  // invece di `rows`/`cols`: si traducono qui in una griglia quadrata rows=cols=n.
  function normalizeGridDims(data){
    if(data.rows && data.cols) return {rows:data.rows, cols:data.cols};
    return {rows:data.n, cols:data.n};
  }

  function applyLoadedData(data){
    const dims = normalizeGridDims(data);
    rows = dims.rows;
    cols = dims.cols;
    gridBox = data.gridBox;
    cells = normalizeCells(data.cells, rows, cols);
    img = data.img || null;
    puzzleTitle = data.puzzleTitle || '';
    suspectNames = (data.suspectNames && typeof data.suspectNames === 'object') ? {...data.suspectNames} : {};
    selR = 0; selC = 0;
    rowsInput.value = rows;
    colsInput.value = cols;
    puzzleTitleInput.value = puzzleTitle;
    updateDimsBadge();
    applyImage();
    buildCellsDom();
    renderSuspects();
    renderGridBox();
    renderCells();
    history = [snapshot()];
    historyIndex = 0;
    updateUndoRedoButtons();

    timerElapsedMs = data.timerElapsedMs || 0;
    timerRunning = !!data.timerRunning;
    timerStartedAt = timerRunning ? Date.now() : null;
    renderTimerDisplay();
    renderTimerButtons();
    if(timerRunning) startTimerTick(); else stopTimerTick();
  }

  // ---------- rendering ----------
  function buildCellsDom(){
    cellsGridEl.innerHTML = '';
    cellsGridEl.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
    cellsGridEl.style.gridTemplateRows = `repeat(${rows}, 1fr)`;
    for(let r=0;r<rows;r++){
      for(let c=0;c<cols;c++){
        const div = document.createElement('div');
        div.className = 'cell';
        div.dataset.r = r;
        div.dataset.c = c;
        const mark = document.createElement('div');
        mark.className = 'mark';
        const candidates = document.createElement('div');
        candidates.className = 'candidates';
        const ghost = document.createElement('div');
        ghost.className = 'ghost';
        const decision = document.createElement('div');
        decision.className = 'decision';
        div.appendChild(mark);
        div.appendChild(candidates);
        div.appendChild(ghost);
        div.appendChild(decision);
        div.addEventListener('click', onCellClick);
        div.addEventListener('pointerenter', onCellEnter);
        div.addEventListener('pointerleave', onCellLeave);
        cellsGridEl.appendChild(div);
      }
    }
    buildAxisLabels();
  }

  // etichette R1…Rn / C1…Cn: vivono dentro #gridBox ma posizionate appena fuori
  // dai suoi bordi, così restano allineate alla griglia in qualsiasi posizione.
  function buildAxisLabels(){
    colLabelsEl.innerHTML = '';
    colLabelsEl.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
    for(let c=0;c<cols;c++){
      const d = document.createElement('div');
      d.className = 'axis-label';
      d.dataset.c = c;
      d.innerHTML = '<i>C' + (c+1) + '</i>';
      colLabelsEl.appendChild(d);
    }
    rowLabelsEl.innerHTML = '';
    rowLabelsEl.style.gridTemplateRows = `repeat(${rows}, 1fr)`;
    for(let r=0;r<rows;r++){
      const d = document.createElement('div');
      d.className = 'axis-label';
      d.dataset.r = r;
      d.innerHTML = '<i>R' + (r+1) + '</i>';
      rowLabelsEl.appendChild(d);
    }
  }

  function renderCells(){
    const divs = cellsGridEl.children;
    for(let i=0;i<divs.length;i++){
      const div = divs[i];
      const r = +div.dataset.r, c = +div.dataset.c;
      const cell = cells[r][c];
      const isSel = locked && r === selR && c === selC;
      div.classList.toggle('disabled', cell.x);
      div.classList.toggle('selected', isSel);
      div.classList.toggle('cross', locked && !isSel && (r === selR || c === selC));
      div.classList.toggle('has-decision', !!cell.decision);

      const decisionEl = div.querySelector('.decision');
      const candidatesEl = div.querySelector('.candidates');
      const markEl = div.querySelector('.mark');

      if(cell.decision){
        decisionEl.textContent = cell.decision.toUpperCase();
        decisionEl.style.background = letterColor(cell.decision);
      } else {
        decisionEl.textContent = '';
      }

      const mark = cell.mark ? MARK_BY_ID[cell.mark] : null;
      markEl.textContent = mark ? mark.glyph : '';
      markEl.style.color = mark ? mark.color : '';

      candidatesEl.innerHTML = '';
      candidatesEl.style.setProperty('--chip', chipScale(cell.candidates.length));
      cell.candidates.forEach(l=>{
        const span = document.createElement('span');
        span.textContent = l;
        span.style.background = letterColor(l);
        candidatesEl.appendChild(span);
      });
    }
    renderAxisHighlight();
  }

  // Dimensione dei gettoni-indizio in frazione di cella. Non è una semplice scala
  // decrescente: ogni valore è scelto perché quel numero di gettoni riempia righe
  // intere dentro il 90% di cella disponibile (es. 4 stanno meglio in 2×2 che in
  // una riga da 4, quindi possono restare più grandi di quando sono 3).
  function chipScale(n){
    if(n <= 1) return '.4';
    if(n === 2) return '.34';
    if(n === 3) return '.27';
    if(n === 4) return '.31';
    if(n <= 6) return '.27';
    if(n <= 9) return '.22';
    if(n <= 12) return '.18';
    return '.15';
  }

  function renderAxisHighlight(){
    // "done" = quella riga/colonna ha già la sua decisione, quindi per il vincolo
    // torre è chiusa: si legge dall'etichetta senza dover cercare nella griglia
    const rowDone = [], colDone = [];
    for(let r=0;r<rows;r++) rowDone[r] = cells[r].some(c => c.decision);
    for(let c=0;c<cols;c++){
      let done = false;
      for(let r=0;r<rows;r++) if(cells[r][c].decision){ done = true; break; }
      colDone[c] = done;
    }
    Array.from(colLabelsEl.children).forEach(d=>{
      const c = +d.dataset.c;
      d.classList.toggle('on', locked && c === selC);
      d.classList.toggle('done', !!colDone[c]);
    });
    Array.from(rowLabelsEl.children).forEach(d=>{
      const r = +d.dataset.r;
      d.classList.toggle('on', locked && r === selR);
      d.classList.toggle('done', !!rowDone[r]);
    });
  }

  function renderGridBox(){
    gridBoxEl.style.left = gridBox.x + '%';
    gridBoxEl.style.top = gridBox.y + '%';
    gridBoxEl.style.width = gridBox.w + '%';
    gridBoxEl.style.height = gridBox.h + '%';
    gridBoxEl.classList.toggle('locked', locked);
    updateCellSizeVar();
  }

  function updateCellSizeVar(){
    const rect = gridBoxEl.getBoundingClientRect();
    const size = Math.min(rect.width / cols, rect.height / rows);
    gridBoxEl.style.setProperty('--cell-size', size + 'px');
  }

  // scala l'immagine per occupare al meglio lo spazio disponibile nello stage,
  // sia in larghezza che in altezza — calcolate qui in pixel perché le percentuali
  // CSS non si risolvono correttamente contro un contenitore a larghezza "fit-content".
  // Una volta note le dimensioni intrinseche (naturalWidth/Height, disponibili solo
  // dopo il 'load'), si impostano width/height espliciti così l'immagine viene anche
  // allargata per riempire lo spazio, non solo rimpicciolita se troppo grande
  // (max-width/max-height da sole non ingrandiscono mai un'immagine più piccola dello spazio disponibile).
  function updateImageSize(){
    const cs = getComputedStyle(stageEl);
    const padX = (parseFloat(cs.paddingLeft)||0) + (parseFloat(cs.paddingRight)||0);
    const padY = (parseFloat(cs.paddingTop)||0) + (parseFloat(cs.paddingBottom)||0);
    const availW = Math.max(120, stageEl.clientWidth - padX);
    const availH = Math.max(120, stageEl.clientHeight - padY);
    if(bgImage.naturalWidth && bgImage.naturalHeight){
      const scale = Math.min(availW / bgImage.naturalWidth, availH / bgImage.naturalHeight);
      // i max-* del ramo di fallback qui sotto vanno rimossi, altrimenti restano
      // a vincolare l'immagine ai valori (piccoli) calcolati prima del 'load'
      bgImage.style.maxWidth = 'none';
      bgImage.style.maxHeight = 'none';
      bgImage.style.width = Math.round(bgImage.naturalWidth * scale) + 'px';
      bgImage.style.height = Math.round(bgImage.naturalHeight * scale) + 'px';
    } else {
      // dimensioni intrinseche non ancora note (prima del 'load'): usa il vecchio
      // comportamento di solo contenimento, corretto non appena l'immagine carica
      bgImage.style.width = '';
      bgImage.style.height = '';
      bgImage.style.maxWidth = availW + 'px';
      bgImage.style.maxHeight = availH + 'px';
    }
  }

  // ---------- evidenziazione "tieni premuto" ----------
  function highlightLetterOccurrences(letter){
    const divs = cellsGridEl.children;
    for(let i=0;i<divs.length;i++){
      const div = divs[i];
      const cell = cells[+div.dataset.r][+div.dataset.c];
      div.classList.toggle('letter-highlight', cell.decision === letter || cell.candidates.includes(letter));
    }
  }

  // evidenzia le caselle ancora "vuote" (senza X e senza decisione, indizi a parte)
  function highlightEmptyCells(){
    const divs = cellsGridEl.children;
    for(let i=0;i<divs.length;i++){
      const div = divs[i];
      const cell = cells[+div.dataset.r][+div.dataset.c];
      div.classList.toggle('empty-highlight', !cell.x && !cell.decision);
    }
  }

  function clearHoldHighlights(){
    const divs = cellsGridEl.children;
    for(let i=0;i<divs.length;i++) divs[i].classList.remove('letter-highlight', 'empty-highlight');
  }

  document.addEventListener('pointerup', clearHoldHighlights);
  document.addEventListener('pointercancel', clearHoldHighlights);

  function highlightActiveTool(){
    Array.from(suspectList.children).forEach(card=>{
      card.classList.toggle('active', card.dataset.tool === activeTool);
    });
    Array.from(markRow.children).forEach(b=>{
      b.classList.toggle('toggled', b.dataset.tool === activeTool);
    });
    btnX.classList.toggle('toggled', activeTool === 'x');
    btnSelect.classList.toggle('toggled', activeTool === 'select');
    modePencilBtn.classList.toggle('toggled', activeMode === 'pencil');
    modePenBtn.classList.toggle('toggled', activeMode === 'pen');
    gridBoxEl.classList.toggle('tool-select', activeTool === 'select');
    renderToolHint();
  }

  // riassunto sempre visibile di "cosa scrive il prossimo clic": senza, con il
  // clic che compila la casella non si capirebbe a colpo d'occhio cosa sta per
  // succedere (soprattutto tra indizio e decisione, che è irreversibile).
  function renderToolHint(){
    let text, accent = 'var(--line)';
    if(activeTool === 'select'){
      text = t('toolHintSelect');
    } else if(activeTool === 'x'){
      text = t('toolHintX');
      accent = '#ff6b78';
    } else if(activeTool.charAt(0) === '#'){
      const m = MARK_BY_ID[activeTool.slice(1)];
      text = t('toolHintMark', {glyph: m.glyph});
      accent = m.color;
    } else {
      const name = (suspectNames[activeTool] || '').trim();
      const label = name ? activeTool.toUpperCase() + ' · ' + name : activeTool.toUpperCase();
      text = t(activeMode === 'pen' ? 'toolHintDecision' : 'toolHintClue', {letter: label});
      accent = letterColor(activeTool);
    }
    toolHint.textContent = text;
    toolHint.style.borderLeftColor = accent;
  }

  function selectTool(tool){
    activeTool = tool;
    highlightActiveTool();
  }

  // ---------- cell interaction ----------
  // il click seleziona la cella E vi applica lo strumento attivo (stessa cosa che
  // farebbe la tastiera). Per muoversi senza scrivere c'è lo strumento 'select'.
  function onCellClick(e){
    if(!locked) return; // must lock grid before editing cells
    const div = e.currentTarget;
    selR = +div.dataset.r;
    selC = +div.dataset.c;
    renderCells();
    if(activeTool !== 'select') applyActiveToolToCell(selR, selC);
    updateGhost(div);
  }

  // anteprima trasparente di cosa scriverebbe il clic sulla casella sotto il mouse.
  // Volutamente "stupida": guarda solo le due condizioni strutturali leggibili dalla
  // cella (ha una decisione / ha una X) e non replica le regole, che restano tutte
  // in applyActiveToolToCell — al massimo si clicca e si legge il messaggio.
  function updateGhost(div){
    const g = div.querySelector('.ghost');
    if(!g) return;
    g.className = 'ghost';
    g.textContent = '';
    g.style.background = '';
    g.style.color = '';
    if(!locked || activeTool === 'select') return;
    const cell = cells[+div.dataset.r][+div.dataset.c];
    if(cell.decision) return;
    if(activeTool === 'x'){
      g.classList.add('ghost-x');
      g.textContent = cell.x ? '↺' : '✕';
      return;
    }
    if(cell.x) return;
    if(activeTool.charAt(0) === '#'){
      const m = MARK_BY_ID[activeTool.slice(1)];
      g.classList.add('ghost-mark');
      g.textContent = cell.mark === m.id ? '↺' : m.glyph;
      g.style.color = cell.mark === m.id ? '#ffd77a' : m.color;
      return;
    }
    if(activeMode === 'pen'){
      g.classList.add('ghost-decision');
      g.textContent = activeTool.toUpperCase();
      g.style.background = letterColor(activeTool);
    } else {
      g.classList.add('ghost-clue');
      const has = cell.candidates.includes(activeTool);
      g.textContent = has ? '↺' : activeTool;
      if(has) g.classList.add('ghost-undo');
      else g.style.background = letterColor(activeTool);
    }
  }

  function onCellEnter(e){ updateGhost(e.currentTarget); }
  function onCellLeave(e){
    const g = e.currentTarget.querySelector('.ghost');
    if(g){ g.className = 'ghost'; g.textContent = ''; g.style.background = ''; g.style.color = ''; }
  }

  function applyActiveToolToCell(r, c){
    const cell = cells[r][c];

    if(activeTool === 'x'){
      if(cell.decision){
        showToast(t('toastCellHasDecision'));
        return;
      }
      cell.x = !cell.x;
      if(cell.x){ cell.candidates = []; cell.mark = null; }
      ensureTimerRunning();
      pushHistory();
      renderCells();
      return;
    }

    // simbolo nota: solo annotazione libera, uno per casella, non tocca le regole
    if(activeTool.charAt(0) === '#'){
      if(cell.x){
        showToast(t('toastCellExcluded'));
        return;
      }
      if(cell.decision){
        showToast(t('toastCellAlreadyDecided'));
        return;
      }
      const id = activeTool.slice(1);
      cell.mark = (cell.mark === id) ? null : id;
      ensureTimerRunning();
      pushHistory();
      renderCells();
      return;
    }

    if(cell.x){
      showToast(t('toastCellExcluded'));
      return;
    }

    const letter = activeTool;
    if(activeMode === 'pencil'){
      if(isGloballyDecided(letter)){
        showToast(t('toastLetterDecidedElsewhereClue', {letter}));
        return;
      }
      const idx = cell.candidates.indexOf(letter);
      if(idx >= 0) cell.candidates.splice(idx,1);
      else { cell.candidates.push(letter); cell.candidates.sort(); }
      ensureTimerRunning();
      pushHistory();
      renderCells();
    } else { // pen / decisione — solo su casella vuota (niente altra decisione)
      if(cell.decision){
        showToast(t('toastCellAlreadyDecided'));
        return;
      }
      if(isGloballyDecided(letter)){
        showToast(t('toastLetterDecidedElsewhereDecision', {letter: letter.toUpperCase()}));
        return;
      }
      cell.decision = letter;
      cell.candidates = [];
      cell.mark = null;
      for(const row of cells) for(const c2 of row){
        const idx = c2.candidates.indexOf(letter);
        if(idx >= 0) c2.candidates.splice(idx,1);
      }
      // vincolo "torre": nessun'altra decisione può condividere riga o colonna
      for(let cc=0; cc<cols; cc++){ if(cc !== c){ cells[r][cc].x = true; cells[r][cc].candidates = []; cells[r][cc].mark = null; } }
      for(let rr=0; rr<rows; rr++){ if(rr !== r){ cells[rr][c].x = true; cells[rr][c].candidates = []; cells[rr][c].mark = null; } }
      ensureTimerRunning();
      pushHistory();
      renderCells();
      updateLetterButtonsState();
    }
  }

  function moveSelection(dr, dc){
    selR = Math.max(0, Math.min(rows-1, selR + dr));
    selC = Math.max(0, Math.min(cols-1, selC + dc));
    renderCells();
  }

  function clampSelection(){
    selR = Math.max(0, Math.min(rows-1, selR));
    selC = Math.max(0, Math.min(cols-1, selC));
  }

  // ---------- grid box drag / resize ----------
  let dragState = null;

  gridBoxEl.addEventListener('pointerdown', (e)=>{
    if(locked) return;
    if(e.target.classList.contains('handle')) return; // handled separately
    e.preventDefault();
    gridBoxEl.setPointerCapture(e.pointerId);
    dragState = {mode:'move', startX:e.clientX, startY:e.clientY, start:{...gridBox}};
  });

  Array.from(document.querySelectorAll('.handle')).forEach(h=>{
    h.addEventListener('pointerdown', (e)=>{
      if(locked) return;
      e.preventDefault();
      e.stopPropagation();
      h.setPointerCapture(e.pointerId);
      dragState = {mode:'resize', corner:h.dataset.handle, startX:e.clientX, startY:e.clientY, start:{...gridBox}};
    });
  });

  document.addEventListener('pointermove', (e)=>{
    if(!dragState) return;
    const contRect = imageContainer.getBoundingClientRect();
    const dxPct = (e.clientX - dragState.startX) / contRect.width * 100;
    const dyPct = (e.clientY - dragState.startY) / contRect.height * 100;
    const MIN = 5;

    if(dragState.mode === 'move'){
      let x = dragState.start.x + dxPct;
      let y = dragState.start.y + dyPct;
      x = Math.max(0, Math.min(100 - gridBox.w, x));
      y = Math.max(0, Math.min(100 - gridBox.h, y));
      gridBox.x = x; gridBox.y = y;
    } else if(dragState.mode === 'resize'){
      const s = dragState.start;
      let {x,y,w,h} = s;
      if(dragState.corner === 'se'){
        w = Math.max(MIN, Math.min(100 - s.x, s.w + dxPct));
        h = Math.max(MIN, Math.min(100 - s.y, s.h + dyPct));
      } else if(dragState.corner === 'ne'){
        w = Math.max(MIN, Math.min(100 - s.x, s.w + dxPct));
        h = Math.max(MIN, s.h - dyPct);
        y = s.y + s.h - h;
        if(y < 0){ h += y; y = 0; }
      } else if(dragState.corner === 'sw'){
        w = Math.max(MIN, s.w - dxPct);
        x = s.x + s.w - w;
        if(x < 0){ w += x; x = 0; }
        h = Math.max(MIN, Math.min(100 - s.y, s.h + dyPct));
      } else if(dragState.corner === 'nw'){
        w = Math.max(MIN, s.w - dxPct);
        x = s.x + s.w - w;
        if(x < 0){ w += x; x = 0; }
        h = Math.max(MIN, s.h - dyPct);
        y = s.y + s.h - h;
        if(y < 0){ h += y; y = 0; }
      }
      gridBox = {x,y,w,h};
    }
    renderGridBox();
  });

  document.addEventListener('pointerup', ()=>{
    if(dragState){
      dragState = null;
      pushHistory();
    }
  });

  window.addEventListener('resize', ()=>{ updateImageSize(); updateCellSizeVar(); });


  // ---------- riconoscimento automatico della griglia dalla foto ----------
  // Idea: le linee della griglia sono le uniche strutture che attraversano tutta
  // l'immagine, quindi proiettando il gradiente orizzontale su x (e quello verticale
  // su y) le linee diventano picchi regolari. Da lì si ricavano il riquadro (primo e
  // ultimo picco forte) e il numero di celle (il conteggio che spiega meglio i picchi).
  // L'analisi viene ripetuta su qualche piccola rotazione, perché una foto di una
  // pagina scattata a mano è quasi sempre storta di un grado o due e basta poco
  // per spalmare i picchi e rendere il conteggio irriconoscibile.
  // Non è infallibile: quando non è convinta non applica nulla e lo dice.

  const DETECT_MAX_SIDE = 700;
  const DETECT_ANGLES = [0, -1, 1, -2, 2, -3, 3];
  const DETECT_MIN_SCORE = 0.34;

  // colore medio dell'immagine, ottenuto lasciando scalare il browser a 1×1 px:
  // serve a riempire gli angoli scoperti dalla rotazione senza creare bordi finti
  function averageColor(){
    const cv = document.createElement('canvas');
    cv.width = cv.height = 1;
    const ctx = cv.getContext('2d', {willReadFrequently:true});
    ctx.drawImage(bgImage, 0, 0, 1, 1);
    try{
      const d = ctx.getImageData(0,0,1,1).data;
      return 'rgb(' + d[0] + ',' + d[1] + ',' + d[2] + ')';
    }catch(e){ return '#808080'; }
  }

  function imageLuma(deg, fill){
    const nw = bgImage.naturalWidth, nh = bgImage.naturalHeight;
    if(!nw || !nh) return null;
    const scale = Math.min(1, DETECT_MAX_SIDE / Math.max(nw, nh));
    const W = Math.max(40, Math.round(nw * scale));
    const H = Math.max(40, Math.round(nh * scale));
    const cv = document.createElement('canvas');
    cv.width = W; cv.height = H;
    const ctx = cv.getContext('2d', {willReadFrequently:true});
    ctx.fillStyle = fill;
    ctx.fillRect(0, 0, W, H);
    if(deg){
      ctx.translate(W/2, H/2);
      ctx.rotate(deg * Math.PI / 180);
      ctx.translate(-W/2, -H/2);
    }
    ctx.drawImage(bgImage, 0, 0, W, H);
    let px;
    try{ px = ctx.getImageData(0, 0, W, H).data; }catch(e){ return null; }
    const g = new Float32Array(W*H);
    for(let i=0, q=0; i<W*H; i++, q+=4){
      g[i] = 0.299*px[q] + 0.587*px[q+1] + 0.114*px[q+2];
    }
    return {g, W, H};
  }

  function smooth(arr){
    const out = new Float32Array(arr.length);
    const n = arr.length;
    for(let i=0;i<n;i++){
      const a = i > 0 ? arr[i-1] : arr[i];
      const b = i < n-1 ? arr[i+1] : arr[i];
      out[i] = (a + 2*arr[i] + b) / 4;
    }
    return out;
  }

  // picchi = massimi locali sopra media+σ, con soppressione dei non-massimi
  // (altrimenti una linea spessa qualche pixel conterebbe più volte)
  function findPeaks(arr, minDist){
    const n = arr.length;
    let mean = 0;
    for(let i=0;i<n;i++) mean += arr[i];
    mean /= n;
    let sd = 0;
    for(let i=0;i<n;i++) sd += (arr[i]-mean)*(arr[i]-mean);
    sd = Math.sqrt(sd/n);
    const thr = mean + 0.55*sd;
    const cand = [];
    for(let i=1;i<n-1;i++){
      if(arr[i] >= thr && arr[i] >= arr[i-1] && arr[i] >= arr[i+1]) cand.push(i);
    }
    cand.sort((a,b)=>arr[b]-arr[a]);
    const kept = [];
    for(const i of cand){
      let ok = true;
      for(const k of kept) if(Math.abs(k-i) < minDist){ ok = false; break; }
      if(ok) kept.push(i);
    }
    kept.sort((a,b)=>a-b);
    return kept;
  }

  // per ogni numero di celle plausibile: quanta parte delle linee attese trova
  // (coverage) e quanta parte dei picchi osservati spiega (explained). Il prodotto
  // penalizza da solo sia i conteggi troppo bassi sia quelli troppo alti.
  function countCandidates(peaks, a, b){
    const span = b - a;
    const out = [];
    for(let n=2;n<=22;n++){
      const step = span / n;
      if(step < 7) continue;
      // tolleranza legata all'incertezza sulla posizione di una linea, NON alla
      // dimensione della cella: se cresce con il passo, i conteggi piccolissimi
      // (2×2, 3×3) "spiegano" qualsiasi cosa e vincono su foto storte o senza griglia
      const tol = Math.max(2, Math.min(step*0.2, 9));
      let matched = 0;
      for(let k=0;k<=n;k++){
        const pos = a + k*step;
        for(const pk of peaks){ if(Math.abs(pk-pos) <= tol){ matched++; break; } }
      }
      let explained = 0;
      for(const pk of peaks){
        const k = Math.round((pk-a)/step);
        if(k >= 0 && k <= n && Math.abs(a + k*step - pk) <= tol) explained++;
      }
      const coverage = matched/(n+1);
      // quasi tutte le linee attese devono esserci davvero: è ciò che distingue
      // una griglia vera da un allineamento fortuito
      const score = coverage < 0.75 ? 0 : coverage * (peaks.length ? explained/peaks.length : 0);
      out.push({n, step, score});
    }
    out.sort((p,q)=>q.score-p.score);
    return out.slice(0, 5);
  }

  function axisAnalysis(profile){
    const prof = smooth(smooth(profile));
    let max = 0;
    for(let i=0;i<prof.length;i++) max = Math.max(max, prof[i]);
    if(max <= 0) return null;
    const peaks = findPeaks(prof, Math.max(3, Math.floor(prof.length/44)));
    if(peaks.length < 4) return null;
    // il riquadro va dal primo all'ultimo picco "forte": il bordo esterno del
    // puzzle è spesso e finisce sempre in questa fascia
    let peakMax = 0;
    for(const pk of peaks) peakMax = Math.max(peakMax, prof[pk]);
    const strong = peaks.filter(pk => prof[pk] >= peakMax*0.45);
    const a = strong[0], b = strong[strong.length-1];
    if(b - a < prof.length*0.3) return null;
    const inner = peaks.filter(pk => pk >= a && pk <= b);
    return {a, b, candidates: countCandidates(inner, a, b)};
  }

  function analyzeAtAngle(deg, fill){
    const im = imageLuma(deg, fill);
    if(!im) return null;
    const {g, W, H} = im;

    const vProf = new Float32Array(W); // linee verticali → gradiente orizzontale
    for(let x=1;x<W-1;x++){
      let sum = 0;
      for(let y=0;y<H;y++) sum += Math.abs(g[y*W+x+1] - g[y*W+x-1]);
      vProf[x] = sum/H;
    }
    const hProf = new Float32Array(H); // linee orizzontali → gradiente verticale
    for(let y=1;y<H-1;y++){
      let sum = 0;
      for(let x=0;x<W;x++) sum += Math.abs(g[(y+1)*W+x] - g[(y-1)*W+x]);
      hProf[y] = sum/W;
    }

    const ax = axisAnalysis(vProf);
    const ay = axisAnalysis(hProf);
    if(!ax || !ay) return null;
    return {ax, ay, W, H};
  }

  // le caselle di un Murdoku sono quadrate: a parità di punteggio si preferisce
  // la coppia (righe, colonne) che rende la cella più vicina a un quadrato
  function bestPair(an){
    let best = null;
    for(const cx of an.ax.candidates){
      for(const cy of an.ay.candidates){
        const ratio = cx.step / cy.step;
        const squareness = 1 / (1 + Math.abs(Math.log(ratio))*2.5);
        const score = cx.score * cy.score * squareness;
        if(score > 0 && (!best || score > best.score)) best = {score, cols:cx.n, rows:cy.n};
      }
    }
    return best;
  }

  function boxOf(an){
    return {
      x: an.ax.a / an.W * 100,
      y: an.ay.a / an.H * 100,
      w: (an.ax.b - an.ax.a) / an.W * 100,
      h: (an.ay.b - an.ay.a) / an.H * 100
    };
  }

  function detectGridFromImage(){
    if(!bgImage.naturalWidth) return null;
    const fill = averageColor();
    let zero = null, best = null;
    for(const deg of DETECT_ANGLES){
      const an = analyzeAtAngle(deg, fill);
      if(deg === 0) zero = an;
      if(!an) continue;
      const pick = bestPair(an);
      if(pick && (!best || pick.score > best.score)) best = {score:pick.score, rows:pick.rows, cols:pick.cols, an};
      if(best && best.score > 0.95) break; // già ottimo: inutile provare altre rotazioni
    }
    if(!best || best.score < DETECT_MIN_SCORE) return null;

    // il riquadro si prende sempre dall'immagine NON ruotata: `gridBox` è allineato
    // agli assi, quindi su una foto storta può solo approssimare la griglia vera
    const box = zero ? boxOf(zero) : (best.an ? boxOf(best.an) : {x:0, y:0, w:100, h:100});
    return {rows: best.rows, cols: best.cols, score: best.score, box};
  }

  function isGridEmpty(){
    for(const row of cells) for(const c of row){
      if(c.x || c.decision || c.candidates.length || c.mark) return false;
    }
    return true;
  }

  function autoDetectGrid(auto){
    if(!img){
      if(!auto) showToast(t('toastDetectNoImage'));
      return;
    }
    const res = detectGridFromImage();
    if(!res){
      if(!auto) showToast(t('toastDetectFailed'));
      return;
    }
    const changesDims = (res.rows !== rows || res.cols !== cols);
    let applyDims = changesDims;
    if(changesDims && !isGridEmpty()){
      applyDims = confirm(t('confirmDetectResize', {rows:res.rows, cols:res.cols}));
    }
    gridBox = res.box;
    if(applyDims){
      rows = res.rows;
      cols = res.cols;
      rowsInput.value = rows;
      colsInput.value = cols;
      cells = makeEmptyCells(rows, cols);
      selR = 0; selC = 0;
      updateDimsBadge();
      buildCellsDom();
      renderSuspects();
    }
    renderGridBox();
    renderCells();
    pushHistory();
    showToast(applyDims || !changesDims
      ? t('toastDetected', {rows:res.rows, cols:res.cols})
      : t('toastDetectedBoxOnly'));
  }

  // ---------- keyboard ----------
  document.addEventListener('keydown', (e)=>{
    if(e.key === 'Escape' && helpOverlay.classList.contains('show')){ toggleHelp(false); return; }

    // nessuna scorciatoia mentre si scrive in un campo di testo (righe/colonne,
    // nome del puzzle, nomi dei sospettati): lì Ctrl+Z deve restare l'undo del browser
    const tag = (e.target.tagName || '').toLowerCase();
    if(tag === 'input' || tag === 'textarea') return;

    if((e.ctrlKey||e.metaKey) && !e.shiftKey && e.key.toLowerCase()==='z'){ e.preventDefault(); undo(); return; }
    if((e.ctrlKey||e.metaKey) && (e.key.toLowerCase()==='y' || (e.shiftKey && e.key.toLowerCase()==='z'))){ e.preventDefault(); redo(); return; }

    if(!locked) return; // grid is being positioned, not edited
    if(e.ctrlKey || e.metaKey || e.altKey) return;

    if(e.key === 'ArrowUp'){ e.preventDefault(); moveSelection(-1,0); return; }
    if(e.key === 'ArrowDown'){ e.preventDefault(); moveSelection(1,0); return; }
    if(e.key === 'ArrowLeft'){ e.preventDefault(); moveSelection(0,-1); return; }
    if(e.key === 'ArrowRight'){ e.preventDefault(); moveSelection(0,1); return; }

    const mark = MARKS.find(m => m.key === e.key);
    if(mark){
      e.preventDefault();
      selectTool('#' + mark.id);
      applyActiveToolToCell(selR, selC);
      return;
    }

    if(e.key.toLowerCase() === 'x'){
      e.preventDefault();
      selectTool('x');
      applyActiveToolToCell(selR, selC);
      return;
    }

    if(/^[a-z]$/i.test(e.key)){
      const lower = e.key.toLowerCase();
      const isUpper = e.key >= 'A' && e.key <= 'Z';
      if(!validLetters(objectCount(rows, cols)).includes(lower)) return; // not a valid letter for these dimensions
      e.preventDefault();
      activeTool = lower;
      activeMode = isUpper ? 'pen' : 'pencil';
      highlightActiveTool();
      applyActiveToolToCell(selR, selC);
    }
  });

  // ---------- export / import ----------
  btnExport.addEventListener('click', ()=>{
    const suggested = puzzleTitle.trim() || 'murdoku';
    const name = prompt(t('exportPrompt'), suggested);
    if(!name) return;
    const data = JSON.stringify({name, rows, cols, gridBox, cells, img, puzzleTitle, suspectNames});
    const blob = new Blob([data], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = name.replace(/[^a-z0-9\-_]+/gi,'_') + '-' + new Date().toISOString().slice(0,19).replace(/[:T]/g,'-') + '.json';
    a.click();
    URL.revokeObjectURL(url);
  });

  // l'importazione sovrascrive la sessione di lavoro corrente, dopo conferma
  btnImport.addEventListener('click', ()=>importInput.click());
  importInput.addEventListener('change', ()=>{
    const file = importInput.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{
      try{
        const parsed = JSON.parse(reader.result);
        if(!confirm(t('confirmImportOverwrite'))){
          showToast(t('toastImportCancelled'));
          return;
        }
        applyLoadedData({
          n:parsed.n, rows:parsed.rows, cols:parsed.cols,
          gridBox:parsed.gridBox, cells:parsed.cells, img:parsed.img||null,
          puzzleTitle: parsed.puzzleTitle || parsed.name || '',
          suspectNames: parsed.suspectNames || {}
        });
        persist();
        showToast(t('toastImportDone'));
      }catch(e){
        showToast(t('toastImportInvalid'));
      }
    };
    reader.readAsText(file);
    importInput.value = '';
  });

  // ---------- init ----------
  function init(){
    const fresh = {rows:10, cols:10, gridBox:{x:0,y:0,w:100,h:100}, cells:makeEmptyCells(10,10), img:null};
    const data = loadStoredData() || fresh;
    applyLoadedData(data);
    applyTranslations();
  }

  init();
})();
</script>
</body>
</html>
